# pnpm 10+ 默认拦掉依赖的 postinstall 脚本，Electron 的二进制就靠它下载。
# pnpm 11 不再读 package.json 里的 pnpm 字段，只认这个文件；键名为 allowBuilds，值是「包名: 布尔」的映射。
allowBuilds:
  electron: true

# 注意：pnpm 只从 .npmrc 读 auth / registry / TLS / proxy 这几类设置，
# 所以 electron_mirror 写在 .npmrc 里是无效的。国内网络首次安装请带上环境变量：
#   macOS / Linux: ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/ pnpm install
#   Windows (PowerShell): $env:ELECTRON_MIRROR="https://npmmirror.com/mirrors/electron/"; pnpm install
