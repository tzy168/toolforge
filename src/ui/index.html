<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>ToolForge</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 任务侧栏：记录每一段独立对话，可整体收起 -->
    <aside class="side" id="side">
      <div class="side-head">
        <span class="side-brand">ToolForge</span>
        <button id="collapseBtn" class="icon-btn" title="收起侧栏">«</button>
      </div>
      <button id="newTaskBtn" class="new-task">＋ 新任务</button>
      <div class="task-list" id="taskList"></div>
    </aside>

    <main class="main">
      <button id="expandBtn" class="icon-btn expand-btn" title="展开侧栏">☰</button>

      <section class="view" id="viewChat">
        <header class="top">
          <!-- 左侧是工作目录选择器；中间页签；右侧模型与工具数 -->
          <div class="top-side">
            <button id="workspaceBtn" class="ws-btn" title="选择工作目录">
              <span class="ws-icon" aria-hidden="true">▸</span>
              <span id="wsLabel" class="ws-label">选择工作目录</span>
            </button>
          </div>
          <div class="tabs">
            <button class="tab active" data-phase="work">Work</button>
            <button class="tab" data-phase="create">Create Tools</button>
          </div>
          <div class="top-side top-status">
            <span id="headModel" title="当前生效的模型"></span>
            <span id="headTools" title="可注入模型的工具数"></span>
          </div>
        </header>

        <div class="chat" id="chat"></div>

        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="说说你要做什么…（Shift + Enter 换行）"></textarea>
          <button type="submit" id="sendBtn">发送</button>
        </form>
      </section>

      <!-- 设置是独立页面，不是浮层；侧栏在设置页里仍然可用 -->
      <section class="view" id="viewSettings" hidden>
        <header class="top page-top">
          <button id="backBtn" class="back-btn">← 返回</button>
          <div class="page-title">设置</div>
          <div class="back-ghost"></div>
        </header>

        <div class="settings-body">
          <!-- 设置项用左侧菜单切换，后续加「大模型配置」只需多一个 nav-item + pane -->
          <nav class="settings-nav">
            <button class="nav-item active" data-pane="tools">工具</button>
            <button class="nav-item" data-pane="model">模型</button>
          </nav>

          <div class="settings-panes">
            <div class="pane" data-pane="tools">
              <div class="group">
                <h3>待放行 <span id="pendingCount">0</span></h3>
                <p class="hint">放行后才会进入常驻工具池；放行前只有创建它的那次会话能用。</p>
                <div id="pendingList"></div>
              </div>

              <div class="group">
                <h3>工具仓库 <span id="toolCount">0</span></h3>
                <p class="hint">工具目录 <span id="homePath" title="点击打开工具仓库目录"></span></p>
                <div class="row">
                  <button id="importBtn" class="ghost">导入工具包</button>
                  <button id="exportBtn" class="ghost">导出全部</button>
                </div>
                <div id="brokenList"></div>
                <div id="toolList"></div>
                <p class="hint empty-hint" id="toolEmpty" hidden>仓库里还没有工具。</p>
              </div>

              <div class="group">
                <h3>运行环境</h3>
                <p class="hint" id="sandboxLine"></p>
                <p class="hint" id="mcpLine"></p>
              </div>
            </div>

            <div class="pane" data-pane="model" hidden>
              <div class="group">
                <h3>选择模型</h3>
                <p class="hint">没填 API Key 的服务商不可选。选中的服务商会在新对话里生效。</p>
                <div id="modelList" class="model-list"></div>
              </div>

              <div class="group">
                <h3>自定义服务商</h3>
                <p class="hint">任何 OpenAI 兼容接口都行：填 Base URL 与模型名，加上 API Key。</p>
                <div class="form">
                  <label class="field">
                    <span>名称</span>
                    <input id="mpLabel" type="text" placeholder="例如 智谱 / 本地 Ollama" autocomplete="off" />
                  </label>
                  <label class="field">
                    <span>Base URL</span>
                    <input id="mpBaseURL" type="text" placeholder="https://api.example.com/v1" autocomplete="off" />
                  </label>
                  <label class="field">
                    <span>模型名</span>
                    <div class="field-row">
                      <input id="mpModel" type="text" list="mpModelList" placeholder="deepseek-chat / kimi-k3.1-pro，可点「获取模型」" autocomplete="off" />
                      <datalist id="mpModelList"></datalist>
                      <button id="mpFetch" class="ghost" type="button">获取模型</button>
                    </div>
                  </label>
                  <label class="field">
                    <span>API Key</span>
                    <input id="mpKey" type="password" placeholder="sk-…" autocomplete="off" />
                  </label>
                  <div class="row">
                    <button id="mpAdd" class="ghost solid">添加</button>
                  </div>
                </div>
              </div>

              <div class="group">
                <h3>配置文件</h3>
                <p class="hint">
                  API Key 只存在主进程，写入 <code>~/.toolforge/settings.json</code>，界面不会回显。<br />
                  当前生效：<span id="statusLine"></span>
                </p>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 设置入口固定在窗口左下角 -->
  <button id="settingsBtn" class="settings-btn" title="设置" aria-label="设置" aria-controls="viewSettings" aria-expanded="false">⚙</button>

  <script type="module" src="./build/app.js"></script>
</body>
</html>
